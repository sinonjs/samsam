version: 2
updates:
  # Dependency updates monthly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "00:00" # UTC
    open-pull-requests-limit: 3
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # GitHub Actions updates monthly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "01:00"
    open-pull-requests-limit: 3

    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      action-deps:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
